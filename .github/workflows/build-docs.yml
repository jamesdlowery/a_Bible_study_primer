name: Build Word / ODT / PDF / HTML / verifications XLSX

# Runs whenever content changes on main, or manually via the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - 'build/**'   # includes build/verifications/ (the XLSX source data)
      - '.github/workflows/build-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to read release history and publish new releases

# Prevent two runs from computing the same version letter if pushes happen
# in quick succession -- queue them instead of running in parallel.
concurrency:
  group: build-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # The change log compares this build with the previous release's
      # text, so that release's tree is needed. Tags sort correctly as plain
      # strings (vYYYYMMDDx), so the highest existing tag is the previous
      # release. Only that one tag is fetched (shallow), and its tree is
      # unpacked to /tmp/prev_release for build/generate_release_docs.py.
      - name: Fetch previous release tree
        id: prev
        run: |
          PREV=$(git ls-remote --tags origin | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]{8}[a-z]$' | sort | tail -1 || true)
          if [ -n "$PREV" ]; then
            git fetch --depth=1 origin "refs/tags/$PREV:refs/tags/$PREV"
            mkdir -p /tmp/prev_release
            git archive "$PREV" | tar -x -C /tmp/prev_release
            echo "Previous release: $PREV"
          else
            echo "No previous release tag found"
          fi
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Install pandoc, LibreOffice, PyMuPDF, and openpyxl
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice python3-uno --no-install-recommends
          pip install --quiet pymupdf openpyxl reportlab

      # Version format: vYYYYMMDDx -- YYYY/MM/DD is today's date in US
      # Eastern time, and x is a lowercase letter that increments each time
      # this workflow runs on the same calendar day (reset to 'a' on a new
      # day). Determined by checking existing version tags rather than any
      # state file, so it's self-contained and needs no repo commits.
      # 'l' and 'o' are skipped when computing the *next* letter -- they're
      # too easily misread as the digits 1 and 0 in a version stamp (the
      # same reasoning Crockford's Base32 excludes I, L, O, U). Existing
      # tags that already used 'l' or 'o' from before this change are still
      # matched and sorted correctly; only newly-computed letters skip them.
      #
      # This reads git tags directly via `git ls-remote --tags origin`
      # (a live query straight to the remote, needing no local fetch or
      # checkout state) rather than `gh release list`. The two were found
      # to disagree in practice: action-gh-release pushes the tag and
      # creates the Release object as separate steps, and the Releases
      # *list* API can briefly lag behind a just-created release under
      # back-to-back runs (queued here by the concurrency group above) --
      # which silently recomputed the same letter run after run, and
      # since action-gh-release overwrites rather than errors on a
      # repeated tag, that showed up as a successful (green) run that
      # never actually advanced the version. Tags themselves are ordinary
      # git refs, pushed synchronously as part of publishing the release,
      # so listing them directly doesn't have that lag.
      - name: Compute build version
        id: version
        run: |
          TODAY=$(TZ='America/New_York' date +%Y%m%d)
          EXISTING=$(git ls-remote --tags origin "refs/tags/v${TODAY}?" \
            | sed 's#.*refs/tags/##' | grep -E "^v${TODAY}[a-z]$" || true)
          if [ -z "$EXISTING" ]; then
            LETTER="a"
          else
            LAST=$(echo "$EXISTING" | sed "s/^v${TODAY}//" | sort | tail -1)
            LETTER=$(python3 -c "
          skip = {'l', 'o'}
          c = chr(ord('$LAST') + 1)
          while c in skip:
              c = chr(ord(c) + 1)
          print(c)")
          fi
          VERSION="v${TODAY}${LETTER}"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --- DOCX: pass 1 (measure), then pass 2 (apply blank pages) ---

      - name: DOCX pass 1 - assemble without blank pages
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: python3 build/assemble.py docx "$GITHUB_WORKSPACE"

      - name: DOCX pass 1 - build and render to PDF for measurement
        run: |
          pandoc build/full_document_docx.md -o pass1_docx.docx \
            -f markdown+raw_attribute-yaml_metadata_block --wrap=none \
            --reference-doc=build/custom-reference.docx
          python3 build/postprocess_docx.py pass1_docx.docx "${{ steps.version.outputs.version }}"
          python3 build/update_fields_and_export.py pass1_docx.docx pass1_docx.pdf

      - name: DOCX - detect required blank pages
        run: python3 build/detect_pages.py docx pass1_docx.pdf build/targets_meta_docx.json build/blanks_docx.json

      - name: DOCX pass 2 - assemble with blank pages applied
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: python3 build/assemble.py docx "$GITHUB_WORKSPACE" build/blanks_docx.json

      - name: Generate final DOCX
        run: |
          pandoc build/full_document_docx.md \
            -o a_Bible_study_primer.docx \
            -f markdown+raw_attribute-yaml_metadata_block --wrap=none \
            --reference-doc=build/custom-reference.docx
          python3 build/postprocess_docx.py a_Bible_study_primer.docx "${{ steps.version.outputs.version }}"

      # --- ODT: same two-pass process, independently measured (docx and
      # odt can paginate slightly differently, so blank-page placement is
      # computed separately for each rather than reused) ---

      - name: ODT pass 1 - assemble without blank pages
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: python3 build/assemble.py odt "$GITHUB_WORKSPACE"

      - name: ODT pass 1 - build and render to PDF for measurement
        run: |
          pandoc build/full_document_odt.md -o pass1_odt.odt \
            -f markdown+raw_attribute-yaml_metadata_block --wrap=none \
            --reference-doc=build/custom-reference.odt
          python3 build/postprocess_odt.py pass1_odt.odt "${{ steps.version.outputs.version }}"
          python3 build/update_fields_and_export.py pass1_odt.odt pass1_odt.pdf

      - name: ODT - detect required blank pages
        run: python3 build/detect_pages.py odt pass1_odt.pdf build/targets_meta_odt.json build/blanks_odt.json

      - name: ODT pass 2 - assemble with blank pages applied
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: python3 build/assemble.py odt "$GITHUB_WORKSPACE" build/blanks_odt.json

      - name: Generate final ODT
        run: |
          pandoc build/full_document_odt.md \
            -o a_Bible_study_primer.odt \
            -f markdown+raw_attribute-yaml_metadata_block --wrap=none \
            --reference-doc=build/custom-reference.odt
          python3 build/postprocess_odt.py a_Bible_study_primer.odt "${{ steps.version.outputs.version }}"

      - name: Generate PDF (rendered from the final DOCX, so it always matches)
        run: python3 build/update_fields_and_export.py a_Bible_study_primer.docx a_Bible_study_primer.pdf

      - name: Add Front Cover to the PDF's bookmarks panel
        run: python3 build/add_cover_bookmark.py a_Bible_study_primer.pdf

      - name: Generate per-page running headers for main sections
        run: python3 build/generate_headers.py a_Bible_study_primer.pdf build/targets_meta_docx.json "$GITHUB_WORKSPACE"

      - name: Remove running-header text from blank pages
        run: python3 build/blank_page_headers.py a_Bible_study_primer.pdf

      # --- HTML: single pass, no pagination (page breaks are print-CSS only) ---

      - name: Generate HTML
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 build/assemble.py html "$GITHUB_WORKSPACE"
          python3 build/render_html.py build/full_document_html.md build/html_style.html a_Bible_study_primer.html

      # --- Remaining-verifications workbook: regenerated from
      # build/verifications/remaining_verifications.csv (+ _notes.md) on
      # every build, stamped with this run's version, and with each row's
      # marker phrase re-checked against the live markdown (see the
      # script's docstring). Written straight to its versioned name; the
      # stable copy is made alongside the book's below. ---
      - name: Generate remaining-verifications XLSX
        run: |
          python3 build/generate_verifications_xlsx.py \
            "${{ steps.version.outputs.version }}" "$GITHUB_WORKSPACE" \
            "a_Bible_study_primer_remaining_verifications_${{ steps.version.outputs.version }}.xlsx"

      # --- The manual checklist: the checks that need a reader with the
      # book in hand (study-Bible notes not available online, the print
      # RSV2CE), regenerated from the same sources so rows drop off as
      # checks are recorded in position_verifications.csv. ---
      - name: Generate manual checklist XLSX
        run: |
          python3 build/generate_manual_checklist.py \
            "${{ steps.version.outputs.version }}" "$GITHUB_WORKSPACE" \
            "a_Bible_study_primer_manual_checklist_${{ steps.version.outputs.version }}.xlsx"

      # --- Per-release documents: the feature list (what the book contains,
      # counts filled from the live text) and the change log (editor's notes
      # from build/release_docs/changelog.md plus a measured comparison with
      # the previous release's tree fetched above). --promote moves the
      # changelog's "Unreleased" notes under this version, and that edit is
      # committed back below with README and the title page. ---
      - name: Generate feature list and change log PDFs
        run: |
          PREV_ARGS=""
          if [ -n "${{ steps.prev.outputs.tag }}" ]; then
            PREV_ARGS="--prev /tmp/prev_release --prev-version ${{ steps.prev.outputs.tag }}"
          fi
          python3 build/generate_release_docs.py \
            "${{ steps.version.outputs.version }}" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" \
            $PREV_ARGS --promote

      # Versioned copies (e.g. a_Bible_study_primer_v20260823a.docx) are the
      # actual per-run artifacts. Stable, unversioned copies are also kept
      # so the README's fixed "latest" download links never need editing --
      # both sets live in the same release.
      - name: Prepare versioned copies for release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for ext in docx odt pdf html; do
            cp "a_Bible_study_primer.$ext" "a_Bible_study_primer_${VERSION}.$ext"
          done
          cp "a_Bible_study_primer_remaining_verifications_${VERSION}.xlsx" \
             "a_Bible_study_primer_remaining_verifications.xlsx"
          cp "a_Bible_study_primer_manual_checklist_${VERSION}.xlsx" \
             "a_Bible_study_primer_manual_checklist.xlsx"
          cp "a_Bible_study_primer_feature_list_${VERSION}.pdf" "a_Bible_study_primer_feature_list.pdf"
          cp "a_Bible_study_primer_change_log_${VERSION}.pdf" "a_Bible_study_primer_change_log.pdf"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Build ${{ steps.version.outputs.version }}
          body: >
            Automatically generated from the current main branch.
            Stable, unversioned filenames are also attached so existing
            download links keep working.
          make_latest: true
          files: |
            a_Bible_study_primer.docx
            a_Bible_study_primer.odt
            a_Bible_study_primer.pdf
            a_Bible_study_primer.html
            a_Bible_study_primer_${{ steps.version.outputs.version }}.docx
            a_Bible_study_primer_${{ steps.version.outputs.version }}.odt
            a_Bible_study_primer_${{ steps.version.outputs.version }}.pdf
            a_Bible_study_primer_${{ steps.version.outputs.version }}.html
            a_Bible_study_primer_remaining_verifications.xlsx
            a_Bible_study_primer_remaining_verifications_${{ steps.version.outputs.version }}.xlsx
            a_Bible_study_primer_manual_checklist.xlsx
            a_Bible_study_primer_manual_checklist_${{ steps.version.outputs.version }}.xlsx
            a_Bible_study_primer_feature_list.pdf
            a_Bible_study_primer_feature_list_${{ steps.version.outputs.version }}.pdf
            a_Bible_study_primer_change_log.pdf
            a_Bible_study_primer_change_log_${{ steps.version.outputs.version }}.pdf

      # Rewrites only the marked block in README.md (see README_snippet.md)
      # to point at this run's exact versioned filenames, each annotated
      # with its own current size in MB (read straight off the versioned
      # files this same working directory already has, from "Prepare
      # versioned copies for release" above -- so no separate files_dir
      # argument is needed here), then commits that change back to main.
      # Pushes made with the default GITHUB_TOKEN don't re-trigger this
      # workflow, so this can't cause an infinite loop.
      - name: Update README download links
        run: python3 build/update_readme_links.py "${{ steps.version.outputs.version }}"

      # Keeps the title page's own source file in sync with the version
      # actually just released, so it never sits stale in the repo between
      # releases (assemble.py's BUILD_VERSION override already makes every
      # compiled document show the right version regardless, but this keeps
      # the *source* markdown honest too).
      - name: Update title page version
        run: python3 build/update_title_page_version.py "${{ steps.version.outputs.version }}"

      # Two pushes in quick succession are queued by the concurrency group,
      # so by the time a run reaches this step the branch may already carry
      # the previous run's version of these same three files (links, title
      # version, promoted change log). Rebasing a commit prepared against
      # the run's own checkout onto that conflicts every time (seen on
      # 6 Oct 2026: run b's commit-back failed against run a's). So instead
      # of rebasing, this step moves the working tree to the branch's
      # current tip and regenerates the three files there -- all three
      # updaters are idempotent -- then commits and pushes, retrying from a
      # fresh fetch if the push is rejected. The build artifacts in the
      # working directory are untracked, so the checkout leaves them alone.
      - name: Commit updated README, title page and change log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          DATE=$(python3 -c "import datetime; print(datetime.date.today().strftime('%-d %B %Y'))")
          # Drop this run's own edits to the three files; they are regenerated below.
          git checkout -- README.md "010 Title/010 Title Page.md" build/release_docs/changelog.md
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git checkout -q -B ci-commit "origin/$BRANCH"
            python3 build/update_readme_links.py "$VERSION"
            python3 build/update_title_page_version.py "$VERSION"
            python3 -c "import sys; sys.path.insert(0, 'build'); import generate_release_docs as g; g.promote('.', '$VERSION', '$DATE')"
            git add README.md "010 Title/010 Title Page.md" build/release_docs/changelog.md
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "Update download links, title page and change log to $VERSION"
            if git push origin "HEAD:$BRANCH"; then
              break
            fi
            echo "Push rejected (attempt $attempt); refetching and regenerating"
            git reset -q --hard
          done
