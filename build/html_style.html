<style>
  h1.title { display: none; }

  /* max-width: none overrides pandoc's own default standalone-template
     style (body { max-width: 36em; ... }, included automatically ahead
     of this file's own <style> block by build_standalone_shell()) --
     confirmed directly as a real bug otherwise: CSS cascades per
     property, not per rule, so simply not mentioning max-width here (as
     an earlier version of this file did) left pandoc's own 36em (540px
     at this font-size) silently in effect, constraining the sidebar/
     main-content layout to a 220px-wide sliver regardless of what
     .main-content and .content-inner below were themselves given. */
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #000000;
    margin: 0;
    padding: 0;
    max-width: none;
  }

  /* Left-hand sidebar: a fixed-position CSS panel, not a real HTML frame
     (frames are deprecated and would require splitting this into
     multiple files) -- functionally the same as a PDF viewer's
     bookmarks panel: a collapsed-by-default, click-to-expand outline of
     every heading in the document, built in render_html.py. Both the
     sidebar's own width and the main content's offset are driven by
     this one custom property, kept in sync by render_html.py's own
     script (see SIDEBAR_SCRIPT there) as the sidebar is dragged wider
     or narrower -- CSS alone has no way for one element's resize to
     reactively resize an unrelated sibling, so this is the one place
     in this file that isn't achievable with CSS alone. */
  :root {
    --sidebar-width: 320px;
  }
  .main-content {
    margin-left: var(--sidebar-width);
    transition: margin-left 0.15s ease;
  }
  .content-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 2em 2.5em;
    box-sizing: border-box;
  }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--sidebar-width);
    height: 100vh;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 3em 1em 3em 1em;
    background: #F5F6F8;
    border-right: 1px solid #CCCCCC;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.8em;
    line-height: 1.4;
    transition: transform 0.15s ease, width 0.15s ease;
  }
  .sidebar a {
    text-decoration: none;
    color: #1F4E79;
  }
  .sidebar a:hover {
    text-decoration: underline;
  }
  .sidebar details {
    margin: 0.1em 0;
  }
  .sidebar summary {
    cursor: pointer;
    padding: 0.15em 0;
    list-style-position: outside;
  }
  .sidebar summary::marker {
    color: #808080;
  }
  .sidebar-children {
    margin-left: 0.7em;
    padding-left: 0.6em;
    border-left: 1px solid #DDDDDD;
  }
  .sidebar-leaf {
    margin-left: 1.1em;
    padding: 0.15em 0;
  }

  /* Collapse toggle: deliberately a sibling of .sidebar, not a child --
     it has to stay fixed in place and clickable even once the sidebar
     itself is slid off-screen, to be able to bring it back. */
  #sidebar-toggle {
    position: fixed;
    top: 0.6em;
    left: 0.6em;
    z-index: 1001;
    width: 2.2em;
    height: 2.2em;
    box-sizing: border-box;
    border: 1px solid #CCCCCC;
    background: #FFFFFF;
    color: #1F4E79;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
    line-height: 1;
    padding: 0;
  }
  #sidebar-toggle:hover {
    background: #EDEFF2;
  }

  /* Resize handle: a thin strip tracking the sidebar's own right edge,
     spanning the full viewport height, dragged via render_html.py's own
     script. A sibling of .sidebar, not a child of it -- see
     build_sidebar_nav()'s own comment on why. left is offset by -3px so
     the strip straddles the sidebar's actual edge rather than sitting
     only just inside or outside it. */
  #sidebar-resize-handle {
    position: fixed;
    top: 0;
    left: calc(var(--sidebar-width) - 3px);
    width: 6px;
    height: 100vh;
    cursor: col-resize;
    z-index: 5;
    transition: left 0.15s ease;
  }
  body.sidebar-resizing #sidebar-resize-handle {
    transition: none;
  }
  #sidebar-resize-handle:hover,
  body.sidebar-resizing #sidebar-resize-handle {
    background: #2E75B6;
    opacity: 0.4;
  }
  /* While actively dragging: no transition (so the width tracks the
     mouse instantly instead of visibly lagging behind it) and no text
     selection (so a fast drag doesn't also select the page's own text). */
  body.sidebar-resizing {
    cursor: col-resize;
    user-select: none;
  }
  body.sidebar-resizing .sidebar,
  body.sidebar-resizing .main-content {
    transition: none;
  }

  /* Collapsed state: the sidebar slides fully off-screen (kept in the
     DOM, not removed, so re-expanding is instant) and the main content
     reclaims the full width. */
  .page-layout.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
  }
  .page-layout.sidebar-collapsed .main-content {
    margin-left: 0;
  }
  /* The handle's own position tracks --sidebar-width, not the sidebar's
     collapsed/expanded state directly, so without this it would keep
     floating at the old width position once the sidebar itself has
     already slid out of view -- resizing something no longer visible
     isn't meaningful anyway. */
  .page-layout.sidebar-collapsed #sidebar-resize-handle {
    display: none;
  }

  /* Narrow viewports (phones/tablets): a fixed rail would crowd out the
     reading content, so the sidebar instead flows above it as an
     ordinary, height-limited scrolling block -- still fully usable, just
     not pinned to the screen while scrolling, and not resizable (there's
     no adjacent content column for a width change to meaningfully
     affect here). The collapse toggle still works, to reclaim the
     screen space the sidebar takes up above the reading content. */
  @media (max-width: 900px) {
    .sidebar {
      position: static;
      width: 100%;
      height: auto;
      max-height: 40vh;
      border-right: none;
      border-bottom: 1px solid #CCCCCC;
      transform: none;
    }
    .main-content {
      margin-left: 0;
    }
    .page-layout.sidebar-collapsed .sidebar {
      display: none;
    }
    #sidebar-resize-handle {
      display: none;
    }
  }
  /* Print: matches every other format's pagination, which has no room
     for (and no use for) an on-screen navigation panel or its controls. */
  @media print {
    .sidebar {
      display: none;
    }
    .main-content {
      margin-left: 0;
    }
    #sidebar-toggle {
      display: none;
    }
  }

  h1, h2, h3, h4, h5, h6 {
    font-style: normal;
  }

  h1, h2, h4, h5 {
    color: #1F4E79;
    font-weight: bold;
    font-size: 1.4em;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
  }

  h3, h6 {
    color: #2E75B6;
    font-weight: bold;
    font-size: 1.15em;
    margin-top: 1.2em;
    margin-bottom: 0.4em;
  }

  /* Title page */
  div[data-custom-style="HiddenHeading"] {
    display: none;
  }
  div[data-custom-style="Title"] {
    text-align: center;
    font-size: 2.2em;
    font-weight: bold;
    color: #000000;
    margin-top: 2em;
    margin-bottom: 0.2em;
  }
  div[data-custom-style="Subtitle"] {
    text-align: center;
    font-size: 1.2em;
    font-weight: normal;
    color: #000000;
    margin-bottom: 2em;
  }

  a {
    color: #2E75B6;
    text-decoration: underline;
  }

  a.back-link {
    display: inline-block;
    font-size: 0.85em;
    margin-top: 1.5em;
    padding-top: 0.6em;
    border-top: 1px solid #DDDDDD;
    color: #666666;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0 1.5em 0;
  }
  th, td {
    border: 1px solid #BFBFBF;
    padding: 0.5em 0.7em;
    text-align: left;
    vertical-align: top;
  }
  thead th {
    background-color: #1F4E79;
    color: #FFFFFF;
    font-weight: bold;
  }

  ul, ol {
    margin-top: 0.3em;
    margin-bottom: 0.8em;
  }

  /* Screen: page-break markers are invisible dividers.
     Print: force an actual page break, matching the DOCX/ODT/PDF pagination. */
  .print-page-break {
    height: 0;
    margin: 0;
    border: none;
  }
  @media print {
    .print-page-break {
      page-break-before: always;
    }
  }

  .closing-footer-rule {
    margin-top: 2em;
    border: none;
    border-top: 1px solid #BFBFBF;
  }
  .closing-footer {
    text-align: center;
    color: #595959;
    font-size: 0.9em;
  }

  /* "Release Candidate" watermark: a pure-CSS pseudo-element fixed to the
     viewport, so it stays visible while scrolling on screen and (via
     position:fixed) repeats on every printed page, matching the
     DOCX/ODT/PDF watermark behavior -- no change to the page's actual
     HTML content is needed. pointer-events:none keeps it from blocking
     clicks on links beneath it. */
  body::before {
    content: "RELEASE CANDIDATE";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 5.5em;
    font-weight: bold;
    color: #808080;
    opacity: 0.5;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1000;
  }
</style>
