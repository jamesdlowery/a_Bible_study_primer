<style>
  h1.title { display: none; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #000000;
    margin: 0;
    padding: 0;
  }

  /* Left-hand sidebar: a fixed-position CSS panel, not a real HTML frame
     (frames are deprecated and would require splitting this into
     multiple files) -- functionally the same as a PDF viewer's
     bookmarks panel: a collapsed-by-default, click-to-expand outline of
     every heading in the document, built in render_html.py. */
  .main-content {
    margin-left: 320px;
    max-width: 900px;
    padding: 2em 2.5em;
    box-sizing: border-box;
  }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    height: 100vh;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 1em 1em 3em 1em;
    background: #F5F6F8;
    border-right: 1px solid #CCCCCC;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.8em;
    line-height: 1.4;
  }
  .sidebar a {
    text-decoration: none;
    color: #1F4E79;
  }
  .sidebar a:hover {
    text-decoration: underline;
  }
  .sidebar details {
    margin: 0.1em 0;
  }
  .sidebar summary {
    cursor: pointer;
    padding: 0.15em 0;
    list-style-position: outside;
  }
  .sidebar summary::marker {
    color: #808080;
  }
  .sidebar-children {
    margin-left: 0.7em;
    padding-left: 0.6em;
    border-left: 1px solid #DDDDDD;
  }
  .sidebar-leaf {
    margin-left: 1.1em;
    padding: 0.15em 0;
  }
  /* Narrow viewports (phones/tablets): a fixed 320px rail would crowd out
     the reading content, so the sidebar instead flows above it as an
     ordinary, height-limited scrolling block -- still fully usable, just
     not pinned to the screen while scrolling. */
  @media (max-width: 900px) {
    .sidebar {
      position: static;
      width: 100%;
      height: auto;
      max-height: 40vh;
      border-right: none;
      border-bottom: 1px solid #CCCCCC;
    }
    .main-content {
      margin-left: 0;
    }
  }
  /* Print: matches every other format's pagination, which has no room
     for (and no use for) an on-screen navigation panel. */
  @media print {
    .sidebar {
      display: none;
    }
    .main-content {
      margin-left: 0;
    }
  }

  h1, h2, h3, h4, h5, h6 {
    font-style: normal;
  }

  h1, h2, h4, h5 {
    color: #1F4E79;
    font-weight: bold;
    font-size: 1.4em;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
  }

  h3, h6 {
    color: #2E75B6;
    font-weight: bold;
    font-size: 1.15em;
    margin-top: 1.2em;
    margin-bottom: 0.4em;
  }

  /* Title page */
  div[data-custom-style="HiddenHeading"] {
    display: none;
  }
  div[data-custom-style="Title"] {
    text-align: center;
    font-size: 2.2em;
    font-weight: bold;
    color: #000000;
    margin-top: 2em;
    margin-bottom: 0.2em;
  }
  div[data-custom-style="Subtitle"] {
    text-align: center;
    font-size: 1.2em;
    font-weight: normal;
    color: #000000;
    margin-bottom: 2em;
  }

  a {
    color: #2E75B6;
    text-decoration: underline;
  }

  a.back-link {
    display: inline-block;
    font-size: 0.85em;
    margin-top: 1.5em;
    padding-top: 0.6em;
    border-top: 1px solid #DDDDDD;
    color: #666666;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0 1.5em 0;
  }
  th, td {
    border: 1px solid #BFBFBF;
    padding: 0.5em 0.7em;
    text-align: left;
    vertical-align: top;
  }
  thead th {
    background-color: #1F4E79;
    color: #FFFFFF;
    font-weight: bold;
  }

  ul, ol {
    margin-top: 0.3em;
    margin-bottom: 0.8em;
  }

  /* Screen: page-break markers are invisible dividers.
     Print: force an actual page break, matching the DOCX/ODT/PDF pagination. */
  .print-page-break {
    height: 0;
    margin: 0;
    border: none;
  }
  @media print {
    .print-page-break {
      page-break-before: always;
    }
  }

  .closing-footer-rule {
    margin-top: 2em;
    border: none;
    border-top: 1px solid #BFBFBF;
  }
  .closing-footer {
    text-align: center;
    color: #595959;
    font-size: 0.9em;
  }

  /* "Release Candidate" watermark: a pure-CSS pseudo-element fixed to the
     viewport, so it stays visible while scrolling on screen and (via
     position:fixed) repeats on every printed page, matching the
     DOCX/ODT/PDF watermark behavior -- no change to the page's actual
     HTML content is needed. pointer-events:none keeps it from blocking
     clicks on links beneath it. */
  body::before {
    content: "RELEASE CANDIDATE";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 5.5em;
    font-weight: bold;
    color: #808080;
    opacity: 0.5;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1000;
  }
</style>
